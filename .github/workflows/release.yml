name: Release

# Publishes Radlet on the Releases page when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in Cargo.toml. A tag with a hyphen, such as
# v0.2.0-beta.1, is published as a prerelease. Re-running the workflow for a
# tag that already has a release replaces its files and keeps its text.
#
# Builds are ad-hoc signed and not notarized (docs/release-notes.md tells
# people how to open them). build-app.sh already takes SIGN_IDENTITY; signing
# and notarization go here once there's a Developer ID certificate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Check the tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "radlet-cli") | .version')"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version ($cargo_version). Bump the version in Cargo.toml, or tag v$cargo_version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the app for Apple silicon and Intel, and pack it
        run: UNIVERSAL=1 mac/scripts/make-dmg.sh

      - name: Check what's inside
        run: |
          app=dist/Radlet.app/Contents
          for binary in "$app/MacOS/Radlet" "$app/Helpers/radlet" "$app/Helpers/radlet-vision" "$app/Helpers/libpdfium.dylib"; do
            lipo "$binary" -verify_arch arm64 x86_64
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$VERSION"
          echo '{"id":1,"method":"hello"}' | "$app/Helpers/radlet" serve | grep '"vision":true'
          "$app/Helpers/radlet-vision" selftest
          ls -l dist/Radlet-"$VERSION".*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("dist/Radlet-$VERSION.dmg" "dist/Radlet-$VERSION.zip" "dist/Radlet-$VERSION.sha256")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            prerelease=""
            if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
            # The install notes come first, then GitHub's list of what changed.
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag $prerelease \
              --title "Radlet $VERSION" --notes-file docs/release-notes.md --generate-notes
          fi
