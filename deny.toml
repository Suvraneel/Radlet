# Enforces the clean-room rule that every dependency is permissively licensed.
# Run with `cargo deny check licenses`.
[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# Our own crates are unpublished and proprietary.
private = { ignore = true }

[bans]
multiple-versions = "allow"
